server:
  port: 8000

spring:
  application:
    name: inventario
  datasource:
    url: 
    username: digital_spring_services
    password: 
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    user:
      name: admin
      password: admin123_cambiame
      roles: ACTUATOR_ADMIN

management:
  endpoints:
    web:
      exposure:
        # Expone /actuator/health y /actuator/info (usa "*" solo en desarrollo local)
        include: health,info
  endpoint:
    health:
      # Muestra el desglose de componentes (PostgreSQL, disco, etc.)
      show-details: always
      probes:
        enabled: true
  health:
    db:
      # Habilita explícitamente la validación de la conexión JDBC a PostgreSQL
      enabled: true